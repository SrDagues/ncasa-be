spring.datasource.url=jdbc:h2:mem:ncasa;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
security.jwt.secret=test-secret-that-is-at-least-thirty-two-characters-long
security.jwt.access-token-expiration=15m
security.jwt.refresh-token-expiration=30d
app.cors.allowed-origins=http://localhost:4200
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=OFF
