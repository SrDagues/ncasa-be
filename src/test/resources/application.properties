spring.datasource.url=jdbc:h2:mem:ncasa;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.flyway.locations=classpath:db/migration
spring.mail.host=localhost
ncasa.household.invitation.expiration=7d
ncasa.household.invitation.frontend-url=http://localhost:4200/invitations/accept
ncasa.household.invitation.from=no-reply@ncasa.test
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
security.jwt.secret=test-secret-that-is-at-least-thirty-two-characters-long
security.jwt.access-token-expiration=15m
security.jwt.refresh-token-expiration=30d
app.cors.allowed-origins=http://localhost:4200
app.auth.refresh-cookie.name=ncasa_refresh
app.auth.refresh-cookie.path=/api/auth
app.auth.refresh-cookie.same-site=Lax
app.auth.refresh-cookie.secure=false
app.auth.refresh-cookie.max-age=30d
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=OFF
