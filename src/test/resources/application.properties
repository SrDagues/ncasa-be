spring.datasource.url=jdbc:h2:mem:ncasa;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.flyway.locations=classpath:db/migration
spring.mail.host=localhost
ncasa.household.invitation.expiration=7d
ncasa.household.invitation.frontend-url=http://localhost:4200/invitations/accept
ncasa.household.invitation.from=no-reply@ncasa.test
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
security.jwt.secret=test-secret-that-is-at-least-thirty-two-characters-long
security.jwt.access-token-expiration=15m
security.jwt.refresh-token-expiration=30d
app.cors.allowed-origins=http://localhost:4200
app.auth.refresh-cookie.name=ncasa_refresh
app.auth.refresh-cookie.path=/api/auth
app.auth.refresh-cookie.same-site=Lax
app.auth.refresh-cookie.secure=false
app.auth.refresh-cookie.max-age=30d
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=OFF
ncasa.identity-access.email-verification.token-ttl=24h
ncasa.identity-access.email-verification.resend-cooldown=1m
ncasa.identity-access.email-verification.max-sends-per-24h=5
ncasa.identity-access.email-verification.token-retention=30d
ncasa.identity-access.email-verification.resend-rate-per-minute=1000
ncasa.identity-access.email-verification.confirm-rate-per-minute=1000
ncasa.identity-access.email-verification.frontend-url=http://localhost:4200
ncasa.email.resend.api-key=test-key-not-valid-for-real-delivery
ncasa.email.resend.enabled=false
ncasa.email.resend.from=nCasa <no-reply@mail.ncasa.test>
ncasa.email.resend.api-url=http://localhost:9
ncasa.email.resend.connect-timeout=50ms
ncasa.email.resend.read-timeout=50ms
ncasa.email.resend.max-attempts=1
