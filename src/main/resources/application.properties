spring.application.name=ncasa
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ncasa}
spring.datasource.username=${DB_USERNAME:ncasa_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

security.jwt.secret=${JWT_SECRET}
security.jwt.access-token-expiration=15m
security.jwt.refresh-token-expiration=30d
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
