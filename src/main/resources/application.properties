spring.application.name=ncasa
spring.flyway.locations=classpath:db/migration,classpath:db/postgresql

ncasa.household.invitation.expiration=7d
ncasa.household.invitation.frontend-url=${NCASA_FRONTEND_URL:http://localhost:4200/app/household}
ncasa.household.invitation.from=${NCASA_INVITATION_FROM:no-reply@ncasa.local}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:25}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ncasa}
spring.datasource.username=${DB_USERNAME:ncasa_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

security.jwt.secret=${JWT_SECRET}
security.jwt.access-token-expiration=15m
security.jwt.refresh-token-expiration=30d
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.auth.refresh-cookie.name=ncasa_refresh
app.auth.refresh-cookie.path=/api/auth
app.auth.refresh-cookie.same-site=Lax
app.auth.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:false}
app.auth.refresh-cookie.max-age=30d
