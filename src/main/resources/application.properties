spring.application.name=ncasa
server.port=${PORT:8080}
logging.structured.format.console=ecs
logging.structured.format.file=ecs
logging.file.name=${NCASA_LOG_FILE:logs/ncasa.log}
logging.logback.rollingpolicy.file-name-pattern=${NCASA_LOG_FILE:logs/ncasa.log}.%d{yyyy-MM-dd}.%i.gz
logging.logback.rollingpolicy.max-file-size=25MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
logging.logback.rollingpolicy.clean-history-on-start=true
spring.flyway.locations=classpath:db/migration,classpath:db/postgresql

ncasa.household.invitation.expiration=7d
ncasa.household.invitation.frontend-url=${NCASA_FRONTEND_URL:http://localhost:4200/app/household}
ncasa.household.invitation.from=${NCASA_INVITATION_FROM:no-reply@ncasa.local}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:25}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ncasa}
spring.datasource.username=${DB_USERNAME:ncasa_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

security.jwt.secret=${JWT_SECRET}
security.jwt.access-token-expiration=15m
security.jwt.refresh-token-expiration=30d
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.auth.refresh-cookie.name=ncasa_refresh
app.auth.refresh-cookie.path=/api/auth
app.auth.refresh-cookie.same-site=Lax
app.auth.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:false}
app.auth.refresh-cookie.max-age=30d

ncasa.identity-access.email-verification.token-ttl=${EMAIL_VERIFICATION_TOKEN_TTL:24h}
ncasa.identity-access.email-verification.resend-cooldown=${EMAIL_VERIFICATION_RESEND_COOLDOWN:1m}
ncasa.identity-access.email-verification.max-sends-per-24h=${EMAIL_VERIFICATION_MAX_SENDS_PER_24H:5}
ncasa.identity-access.email-verification.token-retention=${EMAIL_VERIFICATION_TOKEN_RETENTION:30d}
ncasa.identity-access.email-verification.resend-rate-per-minute=${EMAIL_VERIFICATION_RESEND_RATE_PER_MINUTE:10}
ncasa.identity-access.email-verification.confirm-rate-per-minute=${EMAIL_VERIFICATION_CONFIRM_RATE_PER_MINUTE:30}
ncasa.identity-access.email-verification.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}

ncasa.email.resend.api-key=${RESEND_API_KEY}
ncasa.email.resend.enabled=true
ncasa.email.resend.from=${RESEND_FROM_EMAIL:nCasa <no-reply@mail.ncasa.es>}
ncasa.email.resend.api-url=https://api.resend.com
ncasa.email.resend.connect-timeout=${RESEND_CONNECT_TIMEOUT:2s}
ncasa.email.resend.read-timeout=${RESEND_READ_TIMEOUT:5s}
ncasa.email.resend.max-attempts=${RESEND_MAX_ATTEMPTS:3}

ncasa.expense-plans.generation-delay=1m
ncasa.expense-plans.reminder-delay=1m
ncasa.expense-plans.batch-size=100
ncasa.outbox.dispatch-delay=5s
ncasa.outbox.batch-size=100
ncasa.outbox.max-attempts=10
